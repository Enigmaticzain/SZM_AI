# Legendary AI Configuration

[LLM]
# Model to use (mistral, neural-chat, llama2, dolphin-mixtral)
model = mistral

# Ollama server URL
ollama_url = http://localhost:11434

# Temperature (0.0-1.0, higher = more creative)
temperature = 0.7

# Max tokens per response
max_tokens = 2000

[AGENT]
# Maximum iterations per task
max_iterations = 5

# Enable debug output
debug = false

# Safe mode (blocks dangerous commands)
safe_mode = true

[MEMORY]
# Max short-term memory entries
max_short_term = 50

# Memory storage path
storage_path = ./memory_store

[RESOURCES]
# CPU usage limit (%)
max_cpu_percent = 80

# Memory usage limit (%)
max_memory_percent = 85

# Max processes
max_processes = 500

# Command execution timeout (seconds)
command_timeout = 30

[EXECUTOR]
# Allowed commands (comma-separated)
allowed_commands = python,pip,ls,cat,echo,mkdir,rm,cp,mv,grep,find,git,npm,node,bash,sh

# Block dangerous commands
blocked_commands = rm -rf,sudo,chmod 777,dd,mkfs,format
